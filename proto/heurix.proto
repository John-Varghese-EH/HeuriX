syntax = "proto3";

package heurix.api;

// Field names deliberately mirror the JSON the Tauri frontend already consumes
// (see frontend/App.tsx and hooks/useEngineStats.ts) so the Rust bridge is a
// 1:1 mapping with no renaming logic.

// Telemetry event from the filesystem sensor
message FsEvent {
    string path = 1;
    string event_type = 2;     // "modify" | "create" | "delete" | "rename" | "unknown"
    uint64 timestamp_ms = 3;
}

// Alert generated by the heuristics engine
message Alert {
    string severity = 1;       // "info" | "low" | "medium" | "high" | "critical"
    string description = 2;
    double entropy = 3;
    int32 pid = 4;
    string process_name = 5;
    string action = 6;         // "none" | "suspended" | "terminated" | "quarantined" | "isolated" | "terminated_tree"
    string quarantine_path = 7; // empty if nothing was quarantined
    repeated int32 killed_pids = 8;
    double threat_score = 9;   // 0-100
    uint64 timestamp_ms = 10;
}

// System resource statistics
message SystemStats {
    double cpu_percent = 1;
    double mem_percent = 2;
    uint64 mem_used_mb = 3;
    uint64 mem_total_mb = 4;
    double io_read_mb = 5;
    double io_write_mb = 6;
}

message TelemetryStreamResponse {
    oneof payload {
        FsEvent event = 1;
        Alert alert = 2;
        SystemStats stats = 3;
        string status = 4;     // "started" | "heartbeat" | "stopped" | ...
    }
}

message StreamRequest {}

// Full engine configuration. The UI always sends the complete config
// (proto3 cannot distinguish "unset" from zero for scalars).
message EngineConfig {
    string watch_dir = 1;
    double entropy_threshold = 2;
    uint32 burst_count = 3;
    uint64 burst_window_ms = 4;
    bool auto_kill = 5;
    bool auto_mitigate = 6;
    string mitigation_action = 7; // "suspend" | "terminate" | "quarantine" | "isolate"
}

message ConfigResponse {
    bool success = 1;
    string message = 2;
}

message GetConfigRequest {}

service HeurixDaemon {
    // Streams live telemetry events, alerts, stats and status to the UI
    rpc StreamTelemetry (StreamRequest) returns (stream TelemetryStreamResponse) {}

    // Replaces the heuristic configuration in real time
    rpc UpdateConfig (EngineConfig) returns (ConfigResponse) {}

    // Returns the configuration the daemon is actually running with
    rpc GetConfig (GetConfigRequest) returns (EngineConfig) {}
}
