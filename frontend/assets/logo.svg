<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Minimalist H + X geometric logo for HeuriX -->
  <g transform="translate(4, 0)">
    <!-- Left leg of H (White/Black) -->
    <rect x="15" y="20" width="16" height="60" fill="currentColor" rx="1" />
    
    <!-- Middle bar of H (White/Black) -->
    <rect x="30" y="42" width="14" height="16" fill="currentColor" />
    
    <!-- The X (Electric Blue) forming the right leg of the H -->
    <!-- Slash / -->
    <polygon points="86,20 70,20 46,80 62,80" fill="#3b82f6" />
    <!-- Slash \ -->
    <polygon points="46,20 62,20 86,80 70,80" fill="#3b82f6" />
    
    <!-- Overlay a cutout or mix-blend to make the X intersection sharper if needed, 
         but a simple solid overlapping polygon is very clean. Let's make the intersection pop. -->
    <polygon points="58,50 66,30 74,50 66,70" fill="#2563eb" /> <!-- Darker blue center diamond -->
  </g>
</svg>
